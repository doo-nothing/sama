name: build

permissions:
  contents: write

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      KIT: ${{ github.workspace }}/.kit
      TOOLCHAIN: ${{ github.workspace }}/.toolchain
    steps:
      - uses: actions/checkout@v4

      - name: Cache the Blackfin toolchain
        id: cache
        uses: actions/cache@v4
        with:
          path: .toolchain
          key: bfin-gcc13.3-binutils2.38-linux-v1

      - name: Fetch the Opus 2 plugin kit
        run: git clone --depth 1 https://github.com/LizardMan245/opus.git "$KIT"

      - name: Build the toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo env WORK="$TOOLCHAIN" bash "$KIT/plugin-kit/tools/toolchain/build-bfin-toolchain.sh" \
            fetch verify extract linux
          sudo chown -R "$USER:$USER" "$TOOLCHAIN"

      - name: Check the toolchain
        run: |
          export PATH="$TOOLCHAIN/linux-install/bin:$PATH"
          bfin-elf-gcc --version | head -1

      - name: Build sama.opmod
        run: |
          export PATH="$TOOLCHAIN/linux-install/bin:$PATH"
          export OP1_BFIN_TOOLCHAIN="$TOOLCHAIN/linux-install"
          python3 -m pip install --quiet pyelftools
          python3 "$KIT/plugin-kit/plugin_tool.py" build "$GITHUB_WORKSPACE"
          python3 "$KIT/plugin-kit/plugin_tool.py" show "$KIT/plugin-kit/build/sama.opmod"
          mkdir -p build
          cp "$KIT/plugin-kit/build/sama.opmod" build/

      - name: Host harness and art
        run: |
          python3 -m pip install --quiet pillow
          cd test
          cc -O2 -w -I"$KIT/plugin-kit/sdk" -o host host.c -lm
          ./host /tmp/check.wav 55 61 88 54 20 36 40 30 30 88 78 30 35 30 10 40
          cc -O2 -w -I"$KIT/plugin-kit/sdk" -o render render.c -lm
          ./render /tmp/art.txt
          python3 render.py /tmp/art.txt /tmp/art
          ls -l /tmp/art

      - uses: actions/upload-artifact@v4
        with:
          name: sama-opmod
          path: build/sama.opmod
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/sama.opmod
